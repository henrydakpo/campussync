<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusSync - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
        }
        .password-input-wrap {
            position: relative;
        }
        .password-input-wrap input {
            padding-right: 5rem;
        }
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 0.65rem;
            transform: translateY(-50%);
            padding: 0.35rem 0.45rem;
            border: 0;
            border-radius: 0.35rem;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .password-toggle:hover {
            color: var(--primary);
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-card">
        <a class="auth-home" href="index.html">← CampusSync home</a>
        <div class="brand">CampusSync</div>
        <p class="subtitle">A little more focus. A lot more together.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Campus Email</label>
                <input type="email" id="email" required placeholder="student@st.ug.edu.gh">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    <button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
            </div>
            <button type="submit" class="btn">Sign In to Dashboard</button>
            <div id="error" class="error-msg" role="status" aria-live="polite"></div>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';

        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const passwordInput = document.getElementById(button.getAttribute('aria-controls'));
                const isVisible = passwordInput.type === 'text';
                passwordInput.type = isVisible ? 'password' : 'text';
                button.textContent = isVisible ? 'Show' : 'Hide';
                button.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
                button.setAttribute('aria-pressed', String(!isVisible));
            });
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const submitButton = e.currentTarget.querySelector('button[type="submit"]');
            errorDiv.textContent = '';
            submitButton.disabled = true;
            submitButton.textContent = 'Signing you in...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Save JWT token and redirect to dashboard
                localStorage.setItem('campussync_token', data.token);
                window.location.href = 'dashboard.html';

            } catch (err) {
                errorDiv.textContent = err.message;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
