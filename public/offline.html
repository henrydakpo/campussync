<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#49624e">
    <title>CampusSync - You're offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 1.5rem;
            background: #f5f1e8;
            color: #27352c;
            font-family: "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 28rem);
            padding: 2rem;
            border: 1px solid #e6e1d6;
            border-radius: 1.25rem;
            background: #fffdf8;
            text-align: center;
        }
        h1 { color: #405543; }
        p { color: #687365; line-height: 1.6; }
        a { color: #49624e; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Reconnect to the internet to use CampusSync. Your account and study data are not stored for offline viewing.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
